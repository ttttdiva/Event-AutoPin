name: Source snapshot
on:
  push:
    paths: ['.github/workflows/source-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          git archive --format=tar HEAD > source.tar
          git rev-parse HEAD > source-revision.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: |
            source.tar
            source-revision.txt
          retention-days: 1
