name: Public source reproducibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions: {}

concurrency:
  group: public-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-build:
    name: Build desktop and mobile source from public repository
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Clone public repository anonymously
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: git clone --depth 1 https://github.com/ttttdiva/Event-AutoPin.git .
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python runtime and test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt pytest==8.3.5
      - name: Verify published source dependency closure
        shell: pwsh
        run: python scripts/check_public_dependency_closure.py --repository . --revision HEAD
      - name: Compile Python entry points and modules
        shell: pwsh
        run: python -m compileall -q main.py scripts src
      - name: Test published Python source (excluding non-published reference report assertion)
        shell: pwsh
        run: >-
          python -m pytest -q
          --deselect=tests/unit/test_unlimited_ocr_evaluation.py::test_canonical_repo_event_report_fixes_input_command_and_metrics
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop-app/package-lock.json
            shopping-app/package-lock.json
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install desktop dependencies
        working-directory: desktop-app
        run: npm ci
      - name: Typecheck desktop source
        working-directory: desktop-app
        run: npx tsc --noEmit
      - name: Test desktop state modules
        working-directory: desktop-app
        run: npm test
      - name: Build desktop web source
        working-directory: desktop-app
        run: npm run build
      - name: Build desktop executable from source
        working-directory: desktop-app
        run: npm run tauri:build -- --debug
      - name: Install shopping dependencies
        working-directory: shopping-app
        run: npm ci --legacy-peer-deps
      - name: Typecheck shopping source
        working-directory: shopping-app
        run: npm run typecheck
      - name: Test shopping runtime and config plugin
        working-directory: shopping-app
        run: npm test
      - name: Prove Expo Android source generation
        working-directory: shopping-app
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Build Android debug APK from generated source
        working-directory: shopping-app
        run: .\android\gradlew.bat assembleDebug --no-daemon
